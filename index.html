<style>

<script>

"Ischios":"Leg curl allongé,Leg curl assis,Leg curl debout,Soulevé de terre jambes tendues,Soulevé de terre roumain,Soulevé de terre unilatéral,Nordic curl,Glute-ham raise,Curl ischios Swiss ball",
"Fessiers":"Hip thrust barre,Hip thrust machine,Hip thrust unilatéral,Pont fessier,Kickback fessier poulie,Kickback machine,Abduction machine,Abduction poulie,Squat sumo,Soulevé de terre sumo,Donkey kicks,Fire hydrants,Step-up latéral,Marche latérale élastique,Extension de hanche machine,Cossack squat",

"Mollets":"Mollets debout machine,Mollets assis,Mollets à la presse,Mollets Smith machine,Mollets unilatéral,Donkey calf raise,Tibial antérieur",
"Cardio":"Tapis de course,Course extérieure,Marche inclinée,Marche,Randonnée,Vélo,Vélo elliptique,Rameur,Stairmaster,Corde à sauter,Natation,Assault bike,Ski erg,HIIT,Boxe,Sac de frappe",
"Corps entier":"Burpees,Clean,Power clean,Clean & jerk,Snatch,Thruster,Kettlebell swing,Turkish get-up,Battle ropes,Traîneau (sled push),Sled pull,Wall ball,Box jump,Tire flip,Muscle-up,Man maker,Sandbag carry"};
const EX=[];for(const g in G)G[g].split(",").forEach(n=>EX.push({n,g}));
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0'),iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,td=()=>iso(new Date());
const esc=s=>String(s).replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';'),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const MN=['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
let S;try{S=JSON.parse(localStorage.getItem('fit'))}catch(e){}S=Object.assign({ss:[],wt:[],cu:[],tp:[],hk:{},hw:{},h:0,gw:0,dy:{}},S||{});S.pf=Object.assign({sex:'h',age:0,steps:6000,goal:0,rest:90},S.pf);
let se=0;const save=()=>{try{localStorage.setItem('fit',JSON.stringify(S))}catch(e){if(!se++)alert('Sauvegarde impossible (stockage plein ou navigation privée). Exporte tes données.')}};
let tab='cal',cm=new Date(),sel=td(),ed=null,rest=0,rtm,pg='Tous',pq='',PL=[];
const isC=g=>g=='Cardio',fd=d=>new Date(d+'T12:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});

const vol=s=>s.ex.reduce((a,e)=>a+(isC(e.g)?0:e.sets.reduce((b,x)=>b+x.w*x.r,0)),0);
const nsets=s=>s.ex.reduce((a,e)=>a+e.sets.length,0);
const kc=s=>Math.round(S.hw[s.date]?S.hw[s.date]/Math.max(1,VS().filter(x=>x.date==s.date).length):5*bw()*(s.dur||nsets(s)*3)/60);
const T=t=>{tab=t;R()};
function R(){$('#v').innerHTML={cal:vCal,nu:vNu,wt:vWt,st:vSt,se:vSe}[tab]();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('a',b.dataset.t==tab))}
const mv=n=>{cm=new Date(cm.getFullYear(),cm.getMonth()+n,1);R()};
function vCal(){const y=cm.getFullYear(),m=cm.getMonth(),f=(new Date(y,m,1).getDay()+6)%7,n=new Date(y,m+1,0).getDate(),on=new Set(S.ss.filter(V).map(s=>s.date)),pn=new Set(S.ss.filter(s=>!V(s)).map(s=>s.date));let g='<i></i>'.repeat(f);
for(let d=1;d<=n;d++){const k=`${y}-${pad(m+1)}-${pad(d)}`;g+=`<b class="d${on.has(k)?' on':pn.has(k)?' pl':''}${k==td()?' t':''}${k==sel?' sl':''}" onclick="sel='${k}';R()">${d}</b>`}
const ms=S.ss.filter(s=>V(s)&&s.date.startsWith(`${y}-${pad(m+1)}`)),day=S.ss.filter(s=>s.date==sel);
return `<div class=hd><button onclick="mv(-1)">‹</button><h2>${MN[m]} ${y}</h2><button onclick="mv(1)">›</button></div>
<div class=wk>${'LMMJVSD'.split('').map(x=>`<span>${x}</span>`).join('')}</div><div class=g>${g}</div>
<div class=row><div class=card><small>Séances</small><h3>${ms.length}</h3></div><div class=card><small>Kcal</small><h3>${ms.reduce((a,s)=>a+kc(s),0)}</h3></div><div class=card><small>Volume</small><h3>${(ms.reduce((a,s)=>a+vol(s),0)/1000).toFixed(1)} t</h3></div></div>
${reg(y,m)}<h3 class=sh>${fd(sel)}</h3>${S.hk[sel]?`<p class=mu>Apple Santé : ${Math.round(S.hk[sel])} kcal actives</p>`:''}
${day.map(card).join('')||'<p class=mu>Aucune séance ce jour.</p>'}<button class=pri onclick="ns('${sel}')">+ Nouvelle séance</button>`}

function ns(d,t){ed={id:uid(),date:d||td(),name:t?t.name:'Séance',dur:0,ok:false,ex:t?t.ex.map(e=>({n:e.n,g:e.g,sets:[{r:0,w:0,d:0}]})):[]};E()}

${ed.ex.map((e,i)=>`<div class=ex><header><div><b>${esc(e.n)}</b><small style="display:block">${e.g}${lp(e.n)?' · '+lp(e.n):''}</small></div><button class=sm onclick="ed.ex.splice(${i},1);E()">✕</button></header>

${e.sets.map((x,j)=>`<div class=s><span>${j+1}</span><input type=number inputmode=decimal value="${(isC(e.g)?x.r:x.w)||''}" oninput="ed.ex[${i}].sets[${j}].${isC(e.g)?'r':'w'}=+this.value"><input type=number inputmode=decimal value="${(isC(e.g)?x.w:x.r)||''}" oninput="ed.ex[${i}].sets[${j}].${isC(e.g)?'w':'r'}=+this.value"><button class="${x.d?'k':''}" onclick="ck(${i},${j},this)">✓</button></div>`).join('')}
<button class=sm onclick="as(${i})">+ Série</button><button class=sm onclick="ed.ex[${i}].sets.pop();E()">− Série</button></div>`).join('')}
<button class=sec onclick="pk()">+ Ajouter un exercice</button><button class=pri onclick="sv(1)">Valider la séance ✓</button><button class=sec onclick="stp()">Enregistrer comme modèle</button></div>
<div id=rt><span id=rv></span><span><button class=sm onclick="rest+=15">+15</button><button class=sm onclick="rest=0">Passer</button></span></div>`;m.querySelector('.sc').scrollTop=y}
const as=i=>{const s=ed.ex[i].sets,l=s[s.length-1]||{r:0,w:0};s.push({r:l.r,w:l.w,d:0});E()};
function ck(i,j,b){const x=ed.ex[i].sets[j];x.d=!x.d;b.classList.toggle('k',x.d);if(x.d&&!isC(ed.ex[i].g)){rest=S.pf.rest||90;clearInterval(rtm);rtm=setInterval(tk,1000);tk()}}
